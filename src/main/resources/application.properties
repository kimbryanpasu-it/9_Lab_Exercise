spring.application.name=demo

#Setup JDBC connection
spring.datasource.url=jdbc:mysql://localhost:3307/dbCRUD1

#Setup db login credentials
spring.datasource.username=root

# IMPORTANT: If you still get an "Access denied" error, change Admin.1234 to your actual MySQL root password. 
# (If you use XAMPP, the password is usually blank, so you would just put: spring.datasource.password= )
spring.datasource.password=

#Auto create tables based on entities
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#for stack trace error not to appear
server.error.include-stacktrace=never
server.port = 8080
security.basic.enabled=false